name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # NF3: no device to detect, so the suite must pass everywhere.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # The vendored upstream tree is the reference spec_sync checks against.
      # Cached by tag: the pin is immutable, so a hit is always valid.
      - name: Cache vendored upstream
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-vllm-v0.27.1

      - name: Fetch upstream reference tree
        run: uv run python tools/fetch_upstream.py

      - name: Verify vendored tree matches manifest
        run: uv run python tools/fetch_upstream.py --check

      # G2: fails when a declared upstream counterpart was renamed or removed at
      # the pin. This is what keeps the port from rotting silently.
      - name: Upstream drift check
        run: uv run python tools/spec_sync.py

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # R21.5: the whole suite must stay under 30s on a laptop.
      - name: Test
        run: uv run pytest -q --durations=10

      # R21.6: a green suite says the tests pass, not that they would fail if the
      # code were wrong. Every entry breaks a named guarantee and asserts the test
      # that claims to guard it notices. Runs after the suite because a genuine
      # failure above would make every entry "caught" for the wrong reason.
      - name: Mutation catalogue
        run: uv run python tools/mutate.py

      # Redundant with tests/conformance/ by design. The suite compares a fresh
      # recording to the goldens; this asserts the *tool* that writes them still
      # produces what is checked in, so a broken recorder cannot quietly make
      # future re-recordings wrong while the existing goldens keep passing.
      - name: Conformance goldens are current
        run: |
          uv run python tools/capture_golden_trace.py --check
          uv run python tools/capture_golden_trace.py --metrics

      # Last, and deliberately so. `pvllm/tokenizers/hf.py` imports huggingface_hub
      # and jinja2 from the optional `realtok` extra; without them mypy cannot resolve
      # the module, which is why every non-Windows leg failed here while the check
      # passed locally -- a developer's venv has the extra installed, CI's did not.
      #
      # `uv run --extra` installs into the shared project environment, so this step
      # leaves realtok behind for everything after it. It therefore runs *after* the
      # suite, so the tests keep exercising the default install -- the configuration
      # a user actually gets -- rather than one this step quietly upgraded.
      - name: Types
        run: uv run --extra realtok mypy pvllm
