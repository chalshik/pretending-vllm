# The mutation catalogue. R21.6.
#
# Each entry names a guarantee, the minimal edit that breaks it, and the test that is
# supposed to notice. `tools/mutate.py` applies each edit and asserts the named test
# FAILS. A test that stays green is a test that is not guarding what its name says.
#
# This exists because mutation testing has caught a non-discriminating test nearly
# every time it has been run on this project -- including three the author wrote in
# the two commits immediately before this file. It was run by hand, from memory, only
# on freshly written tests. Written down, it becomes something CI enforces instead of
# something someone remembers.
#
# `old` and `new` are TOML multi-line literal strings. Literal, because these are code
# snippets full of quotes and backslashes and any escaping layer between the file and
# the source would be one more thing to get wrong. Multi-line, because a single-quoted
# TOML string cannot contain a single quote at all -- which this catalogue discovered
# the hard way on its first run.
#
# Rules for entries:
#   * `old` must appear EXACTLY ONCE in `file`. The tool fails loudly if it does not,
#     which is how the catalogue notices that the code moved underneath it.
#   * `new` must be a realistic mistake -- a flipped comparison, a dropped `min`, a
#     removed filter -- not a syntax error. Breaking the parser proves nothing.
#   * `test` should be a single node id, so a failure is unambiguous and the run fast.
#   * `why` is the guarantee in one line. If you cannot state it, the entry is not
#     pinning anything worth pinning.

[[mutation]]
name = '''responses-stream-sends-no-done-sentinel'''
why = '''The Responses stream must not send `[DONE]`; a client that waits for one hangs.'''
file = '''pvllm/entrypoints/openai/api_server.py'''
old = '''            yield f"event: {event['type']}\ndata: {payload}\n\n"'''
new = '''            yield f"event: {event['type']}\ndata: {payload}\n\n"
            yield "data: [DONE]\n\n"'''
test = '''tests/entrypoints/test_responses_api.py::test_the_stream_sends_no_done_sentinel'''

