old = '''        "response.completed",
        {"response": final.model_dump(mode="json", by_alias=True)},'''
new = '''        "response.incomplete" if incomplete else "response.completed",
        {"response": final.model_dump(mode="json", by_alias=True)},'''
test = '''tests/entrypoints/test_responses_api.py::test_an_incomplete_response_still_ends_with_response_completed'''

